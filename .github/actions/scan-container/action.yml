name: Scan container
description: Audit an existing image without rebuilding it
inputs:
  image:
    required: true
    description: Local image tag or immutable registry digest
  platform:
    required: true
    description: Image platform to scan
  category:
    required: true
    description: SARIF category for this image
runs:
  using: composite
  steps:
    - name: Scan container image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PLATFORM: ${{ inputs.platform }}
        TRIVY_QUIET: 'true'
        TRIVY_SKIP_VERSION_CHECK: 'true'
      with:
        image-ref: ${{ inputs.image }}
        version: v0.72.0
        format: json
        output: trivy-results.json
        severity: HIGH,CRITICAL
        vuln-type: os,library
        scanners: vuln
        ignore-unfixed: true
        exit-code: '0'

    - name: Generate Trivy SARIF
      shell: bash
      run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

    - name: Upload Trivy SARIF
      if: >-
        ${{ always() && hashFiles('trivy-results.sarif') != '' &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: trivy-results.sarif
        category: ${{ inputs.category }}

    - name: Enforce Trivy vulnerability gate
      shell: bash
      run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy-results.json
