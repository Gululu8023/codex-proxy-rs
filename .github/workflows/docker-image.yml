# main 的 CI 通过后构建 linux/amd64 镜像并发布到 GHCR。
# 服务器上执行 docker compose pull && docker compose up -d 即可更新到最新提交。
name: Docker image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  source:
    # workflow_run 有写权限，只接受本仓库 main 的 push 检查结果，不能消费 PR 源码。
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      # 使用 main 的检查逻辑，旧 CI 事件不要求旧提交也包含当前工作流脚本。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve source with successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          MAIN_SHA="$(git rev-parse HEAD)" ruby .github/scripts/main-image.rb resolve >> "$GITHUB_OUTPUT"

  image:
    needs: source
    if: needs.source.outputs.sha != ''
    # CI 事件可能乱序，旧任务不能取消新任务；提升 latest 前还需重新核对 main。
    concurrency:
      group: docker-image-main
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Build metadata
        id: meta
        run: |
          # GHCR 镜像名必须小写
          version="$(ruby -r './.github/scripts/release-metadata' -e 'puts ReleaseMetadata.version(YAML.load_file("release/version.yaml").fetch("version"))')"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "version=$version"
            echo "short_sha=${SOURCE_SHA::12}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [[ "$version" == *-exp.* ]]; then
              echo 'build_type=experimental'
            else
              echo 'build_type=release'
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          build-args: |
            CPR_VERSION=${{ steps.meta.outputs.version }}
            CPR_GIT_SHA=${{ env.SOURCE_SHA }}
            CPR_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            CPR_BUILD_TYPE=${{ steps.meta.outputs.build_type }}
          no-cache-filters: runtime-base
          cache-from: type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-main

      - name: Recheck main before promoting latest
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)" ruby .github/scripts/main-image.rb current >> "$GITHUB_OUTPUT"

      - name: Promote built image digest to latest
        if: steps.current.outputs.promote == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')" = "$DIGEST"
